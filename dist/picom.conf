# i3psycho picom config: INVISIBLE compositor. Zero UI change, pure butter.
# All eye candy off; the only job is vsync (tear-free moves and drags) and
# letting fullscreen windows bypass compositing entirely.
backend = "glx";
vsync = true;
unredir-if-possible = true;

shadow = false;
fading = false;
corner-radius = 0;
blur-background = false;

# never repaint more than needed
use-damage = true;
