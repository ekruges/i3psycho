# i3psycho layer — include this from your EXISTING i3 config:
#
#     include /usr/share/i3psycho/psycho.conf
#
# Put the include AFTER your own bindings. i3 keeps the LAST binding for a
# key, so an include placed at the top of your config gets silently overridden
# by everything below it. Then RESTART i3 ($mod+Shift+r) — `reload` re-reads
# the config but never runs exec_always, so psychod will not start.
#
# Then run `i3psycho-doctor`. It checks the handful of things that actually go
# wrong on a preexisting config and prints the line to add for each one.
#
# It adds floating-first behavior and the psychod bindings without touching
# your colors, your bar, or any bind you already have. Remove the line and
# you are back on plain i3. Mirror any change here in psycho.config (the
# standalone config for fresh installs).
#
# Keys claimed below, so you can grep your config before restarting:
#   $mod+m  $mod+Shift+m  $mod+Shift+d  $mod+t  $mod+grave  $mod+o
#   $mod+Left  $mod+Right  $mod+Up  $mod+Down  $mod+Ctrl+1..4

# everything floats; tiling remains available ($mod+t toggles back)
for_window [tiling] floating enable

# Every window needs a titlebar, because that is where the close / iconify /
# maximize buttons are drawn. Applications can ask for no decoration through
# _MOTIF_WM_HINTS and i3 honors that — terminals do it most often, e.g.
# xfce4-terminal's "Display borders around new windows" setting. Without this
# rule those windows come up bare and the buttons appear to be missing.
# Remove it if you would rather let applications decide.
for_window [class=".*"] border normal 2
for_window [floating] border normal 2

# psychod: cascade, exact snapping, minimize, drag-snap, expose, hot corners
exec_always --no-startup-id flock -n /tmp/psychod-${DISPLAY#:}.lock psychod

# minimize with geometry restore
bindsym $mod+m nop psycho:min
bindsym $mod+Shift+m nop psycho:restore

# Snapping: halves / maximize / center, quarters on $mod+Ctrl+1..4.
# Heads up: i3's own default config binds $mod+Left/Right/Up/Down to focus.
# If you kept those, this replaces them — bind focus to $mod+h/j/k/l, or move
# snapping onto $mod+Ctrl+arrows instead.
bindsym $mod+Left  nop psycho:snap:left
bindsym $mod+Right nop psycho:snap:right
bindsym $mod+Up    nop psycho:snap:max
bindsym $mod+Down  nop psycho:snap:center
bindsym $mod+Ctrl+1 nop psycho:snap:tl
bindsym $mod+Ctrl+2 nop psycho:snap:tr
bindsym $mod+Ctrl+3 nop psycho:snap:bl
bindsym $mod+Ctrl+4 nop psycho:snap:br

# MRU cycle, expose, show desktop.
# These deliberately avoid $mod+Tab and $mod+e: those are the two most commonly
# taken binds in a config that already exists ($mod+Tab is a rofi/dmenu window
# switcher in most rices, $mod+e opens a file manager), and an include that
# quietly eats them is how this layer earns a reputation for breaking things.
# Swap them in if they are free for you.
bindsym $mod+grave nop psycho:cycle
bindsym $mod+o     nop psycho:expose
bindsym $mod+Shift+d nop psycho:showdesktop
# bindsym $mod+Tab nop psycho:cycle
# bindsym $mod+e   nop psycho:expose

# tiling still exists, you monster
bindsym $mod+t floating toggle

# ---- knobs (defaults shown; all optional) ----
# These are directives of the PATCHED i3 only. Stock i3 refuses to parse them,
# which makes your whole config unloadable — leave them commented unless you
# are running the patched binary. The defaults are already the values shown.
# psycho_genie_duration 140          # minimize/restore ghost, ms; 0 disables
# psycho_titlebar_buttons yes
# psycho_double_click_titlebar yes
# psycho_snap_edges yes
# psycho_snap_margin 10              # px from the edge that triggers the snap preview
# psycho_chips yes                   # minimized-window chips in i3bar
