# i3psycho layer — include this from your EXISTING i3 config:
#
#     include /usr/share/i3psycho/psycho.conf
#
# Put it BELOW your own bindings — i3 keeps the last binding for a key.
# Then RESTART ($mod+Shift+r); reload never runs exec_always, so psychod
# would not start. Then run i3psycho-doctor.
#
# Adds floating-first behavior and the psychod bindings; your colors, bar and
# binds are untouched. Remove the line for plain i3. Mirror changes here in
# psycho.config (the standalone config).
#
# Keys claimed, to grep for first:
#   $mod+m  $mod+Shift+m  $mod+Shift+d  $mod+t  $mod+grave  $mod+o
#   $mod+Left  $mod+Right  $mod+Up  $mod+Down  $mod+Ctrl+1..4

# everything floats; tiling remains available ($mod+t toggles back)
for_window [tiling] floating enable

# force a titlebar: the buttons are drawn in it, and apps that suppress
# decoration via _MOTIF_WM_HINTS (terminals, mostly) come up bare without this
for_window [class=".*"] border normal 2
for_window [floating] border normal 2

# psychod: cascade, exact snapping, minimize, drag-snap, expose, hot corners
exec_always --no-startup-id flock -n /tmp/psychod-${DISPLAY#:}.lock psychod
# --auto-hide-bars bottom|top|top,bottom parks the bar off-screen and slides
# it back on hover. Needs an override-redirect bar (polybar
# `override-redirect = true`, i3bar `mode hide`), which reserves no space.

# minimize with geometry restore
bindsym $mod+m nop psycho:min
bindsym $mod+Shift+m nop psycho:restore

# snapping: halves / maximize / center, quarters on $mod+Ctrl+1..4.
# note i3's default config binds $mod+arrows to focus; this replaces that.
bindsym $mod+Left  nop psycho:snap:left
bindsym $mod+Right nop psycho:snap:right
bindsym $mod+Up    nop psycho:snap:max
bindsym $mod+Down  nop psycho:snap:center
bindsym $mod+Ctrl+1 nop psycho:snap:tl
bindsym $mod+Ctrl+2 nop psycho:snap:tr
bindsym $mod+Ctrl+3 nop psycho:snap:bl
bindsym $mod+Ctrl+4 nop psycho:snap:br

# MRU cycle, expose, show desktop. off $mod+Tab and $mod+e on purpose: those
# are usually already a window switcher and a file manager. swap in if free.
bindsym $mod+grave nop psycho:cycle
bindsym $mod+o     nop psycho:expose
bindsym $mod+Shift+d nop psycho:showdesktop
# bindsym $mod+Tab nop psycho:cycle
# bindsym $mod+e   nop psycho:expose

# tiling still exists, you monster
bindsym $mod+t floating toggle

# ---- knobs (defaults shown; all optional) ----
# patched i3 only — stock i3 refuses to parse these and your whole config
# becomes unloadable. defaults are the values shown, so leave them commented.
# psycho_genie_duration 140          # minimize/restore ghost, ms; 0 disables
# psycho_titlebar_buttons yes
# psycho_double_click_titlebar yes
# psycho_snap_edges yes
# psycho_snap_margin 10              # px from the edge that triggers the snap preview
# psycho_chips yes                   # minimized-window chips in i3bar
